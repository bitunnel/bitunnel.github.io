<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Treemap | Bitunnel</title>
  <meta name="description" content="TR ve Global bahis/casino giriş adreslerini tek tıkla açabileceğiniz treemap platformu." />

  <!-- UI (opsiyonel ama güzel duruyor) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css"/>

  <!-- D3 + html2canvas -->
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

  <style>
    :root {
      --bg: #0b1220;
      --panel: rgba(255,255,255,.05);
      --panel2: rgba(255,255,255,.08);
      --stroke: rgba(255,255,255,.15);
      --text: #e5e7eb;
    }
    body { background: var(--bg); color: var(--text); }
    .wrap { max-width: 1280px; margin: 22px auto; padding: 0 14px; }
    .topbar {
      display:flex; gap:10px; align-items:center; justify-content:space-between; flex-wrap:wrap;
      margin-bottom: 12px;
    }
    .leftbar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    .pill {
      background: var(--panel); border:1px solid var(--stroke);
      color: var(--text); border-radius: 999px; padding: 8px 12px; font-size: 14px;
      display:inline-flex; gap:8px; align-items:center;
    }
    .hint { opacity:.85; font-size: 13px; }
    #stage {
      width:100%;
      height: 78vh;
      background: rgba(255,255,255,.03);
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,.08);
      overflow:hidden;
      position:relative;
    }
    #chart { width:100%; height:100%; }
    .toolbar {
      position:absolute; top:12px; right:12px;
      display:flex; flex-direction:column; gap:8px;
      z-index: 10;
    }
    .toolbtn {
      width:42px; height:42px; border-radius: 14px;
      background: var(--panel2);
      border: 1px solid rgba(255,255,255,.14);
      color: var(--text);
      display:flex; align-items:center; justify-content:center;
      cursor:pointer;
      user-select:none;
      transition: transform .12s ease, background .12s ease;
    }
    .toolbtn:hover { transform: translateY(-1px); background: rgba(255,255,255,.12); }
    .node { cursor:pointer; }
    .node rect { stroke: rgba(255,255,255,.18); }
    .node:hover rect { stroke: rgba(255,255,255,.60); }
    .label { pointer-events:none; font-size: 12px; fill:#fff; }
    .tag { pointer-events:none; font-size: 11px; fill: rgba(255,255,255,.82); }
    .badge-mini {
      display:inline-block; padding: 4px 10px; border-radius:999px;
      background: rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.10);
      font-size: 12px; opacity: .95;
    }
    .select {
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.12);
      color: var(--text);
      border-radius: 999px;
      padding: 8px 12px;
      outline: none;
    }
    .select option { color:#111; }
    .footerbar {
      margin-top: 10px;
      display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
      opacity:.95;
    }
    .kbd { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New"; }
  </style>
</head>

<body oncontextmenu="return false;">
  <div class="wrap">
    <div class="topbar">
      <div class="leftbar">
        <span class="pill"><i class="fa-solid fa-chart-tree-map"></i> Treemap</span>
        <span class="pill">Kaynak: <span class="kbd">links.json</span></span>
        <span class="hint">Kutuya tıkla → JSON’daki URL yeni sekmede açılsın</span>
      </div>

      <div class="leftbar">
        <label class="pill" style="gap:10px;">
          <i class="fa-solid fa-filter"></i>
          <span>Filtre</span>
          <select id="tagFilter" class="select" aria-label="Tag filtrele">
            <option value="ALL">Tümü</option>
          </select>
        </label>
        <span id="countInfo" class="badge-mini">0 site</span>
      </div>
    </div>

    <div id="stage">
      <div class="toolbar" aria-label="Araçlar">
        <div class="toolbtn" id="zoomInBtn" title="Yakınlaştır (Zoom In)"><i class="fa-solid fa-plus"></i></div>
        <div class="toolbtn" id="zoomOutBtn" title="Uzaklaştır (Zoom Out)"><i class="fa-solid fa-minus"></i></div>
        <div class="toolbtn" id="resetZoomBtn" title="Sıfırla (Reset)"><i class="fa-solid fa-magnifying-glass-minus"></i></div>
        <div class="toolbtn" id="shotBtn" title="Ekran Görüntüsü (PNG indir)"><i class="fa-solid fa-camera"></i></div>
        <div class="toolbtn" id="fsBtn" title="Tam Ekran (Fullscreen)"><i class="fa-solid fa-expand"></i></div>
      </div>

      <div id="chart" aria-label="Treemap grafik alanı"></div>
    </div>

    <div class="footerbar">
      <div class="hint">
        İpucu: <span class="kbd">Enter</span>/<span class="kbd">Click</span> ile açılır •
        <span class="kbd">ESC</span> fullscreen çıkış
      </div>
      <div class="hint">© Treemap</div>
    </div>
  </div>

  <script>
    // =========================
    // Ayarlar
    // =========================
    const LINKS_URL = "./links.json";

    // Tag renkleri (yoksa otomatik palette)
    const TAG_COLORS = new Map([
      ["BetConstruct", "#7c3aed"],
      ["Pronet Gaming", "#06b6d4"],
      ["Popüler", "#f59e0b"]
    ]);

    function hash(s="") {
      let h = 0;
      for (let i=0;i<s.length;i++) h = Math.imul(31,h) + s.charCodeAt(i) | 0;
      return h;
    }

    function colorForTag(tag) {
      return TAG_COLORS.get(tag) || d3.schemeTableau10[Math.abs(hash(tag)) % 10];
    }

    function openUrl(url) {
      if (!url) return;
      window.open(url, "_blank", "noopener,noreferrer");
    }

    // links.json -> hierarchy (tag gruplu)
    function toHierarchy(items, onlyTag = "ALL") {
      const filtered = (onlyTag === "ALL") ? items : items.filter(x => (x.tag || "Diğer") === onlyTag);
      const groups = d3.group(filtered, d => d.tag || "Diğer");

      return {
        name: "Bahis ve Casino Siteleri",
        children: Array.from(groups, ([tag, arr]) => ({
          name: tag,
          children: arr.map(x => ({
            name: x.label,
            url: x.url,
            tag: x.tag || "Diğer",
            category: x.category || "",
            value: 1 // eşit boyut; istersen burada ağırlık verebilirsin
          }))
        }))
      };
    }

    // =========================
    // D3 Treemap + Zoom
    // =========================
    let svg, gRoot, zoomBehavior;
    let currentHierarchy = null;
    let currentTransform = d3.zoomIdentity;

    function clearChart() {
      const el = document.getElementById("chart");
      el.innerHTML = "";
    }

    function renderTreemap(hierarchyData) {
      currentHierarchy = hierarchyData;

      const el = document.getElementById("chart");
      clearChart();

      const width = el.clientWidth;
      const height = el.clientHeight;

      svg = d3.select(el).append("svg")
        .attr("width", width)
        .attr("height", height)
        .style("touch-action", "none"); // zoom için

      // Zoom root group
      gRoot = svg.append("g");

      // Zoom davranışı
      zoomBehavior = d3.zoom()
        .scaleExtent([0.6, 8])
        .on("zoom", (event) => {
          currentTransform = event.transform;
          gRoot.attr("transform", currentTransform);
        });

      svg.call(zoomBehavior);

      // Treemap layout
      const root = d3.hierarchy(hierarchyData)
        .sum(d => d.value || 0)
        .sort((a,b) => (b.value||0) - (a.value||0));

      d3.treemap()
        .size([width, height])
        .paddingInner(6)
        .paddingOuter(10)
        (root);

      const leaves = root.leaves();

      // Nodes
      const nodes = gRoot.selectAll("g.node")
        .data(leaves)
        .enter()
        .append("g")
        .attr("class", "node")
        .attr("transform", d => `translate(${d.x0},${d.y0})`)
        .attr("tabindex", 0)
        .attr("role", "link")
        .attr("aria-label", d => `${d.data.name} sitesini aç`)
        .on("click", (event, d) => openUrl(d.data.url))
        .on("keydown", (event, d) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            openUrl(d.data.url);
          }
        });

      nodes.append("rect")
        .attr("rx", 12)
        .attr("ry", 12)
        .attr("width", d => Math.max(0, d.x1 - d.x0))
        .attr("height", d => Math.max(0, d.y1 - d.y0))
        .attr("fill", d => colorForTag(d.data.tag || d.parent?.data?.name || "Diğer"))
        .attr("opacity", 0.92);

      // Clip (yazı taşmasın)
      nodes.append("clipPath")
        .attr("id", (d, i) => `clip-${i}`)
        .append("rect")
        .attr("rx", 12)
        .attr("ry", 12)
        .attr("width", d => Math.max(0, d.x1 - d.x0))
        .attr("height", d => Math.max(0, d.y1 - d.y0));

      nodes.append("text")
        .attr("clip-path", (d,i) => `url(#clip-${i})`)
        .attr("class", "label")
        .attr("x", 10)
        .attr("y", 18)
        .text(d => d.data.name);

      nodes.append("text")
        .attr("clip-path", (d,i) => `url(#clip-${i})`)
        .attr("class", "tag")
        .attr("x", 10)
        .attr("y", 36)
        .text(d => d.data.tag || "");

      // resize -> yeniden çiz
      window.addEventListener("resize", () => {
        // transform sıfırla ve yeniden render
        currentTransform = d3.zoomIdentity;
        renderTreemap(currentHierarchy);
      }, { once:true });
    }

    // =========================
    // Toolbar aksiyonları
    // =========================
    function zoomInTrue() {
      if (!svg) return;
      svg.transition().duration(180).call(zoomBehavior.scaleBy, 1.2);
    }
    function zoomOutTrue() {
      if (!svg) return;
      svg.transition().duration(180).call(zoomBehavior.scaleBy, 1/1.2);
    }
    function resetZoom() {
      if (!svg) return;
      svg.transition().duration(220).call(zoomBehavior.transform, d3.zoomIdentity);
    }

    async function takeShot() {
      const stage = document.getElementById("stage");
      // toolbar da görünsün istersen stage kalsın; sadece chart istiyorsan #chart seç
      const canvas = await html2canvas(stage, { backgroundColor: null, scale: 2 });
      const a = document.createElement("a");
      a.href = canvas.toDataURL("image/png");
      a.download = `treemap-shot-${Math.floor(Math.random()*10000)}.png`;
      a.click();
    }

    async function toggleFullscreen() {
      const stage = document.getElementById("stage");
      if (!document.fullscreenElement) {
        await stage.requestFullscreen?.();
      } else {
        await document.exitFullscreen?.();
      }
    }

    // =========================
    // Filtre UI
    // =========================
    function populateFilterOptions(items) {
      const select = document.getElementById("tagFilter");
      const tags = Array.from(new Set(items.map(x => x.tag || "Diğer"))).sort((a,b)=>a.localeCompare(b,"tr"));
      for (const t of tags) {
        const opt = document.createElement("option");
        opt.value = t;
        opt.textContent = t;
        select.appendChild(opt);
      }
    }

    function setCountInfo(n) {
      document.getElementById("countInfo").textContent = `${n} site`;
    }

    // =========================
    // Init
    // =========================
    (async function init(){
      try {
        const res = await fetch(LINKS_URL, { cache: "no-store" });
        if (!res.ok) throw new Error("links.json okunamadı: " + res.status);

        const items = await res.json();

        populateFilterOptions(items);
        setCountInfo(items.length);

        // ilk render
        renderTreemap(toHierarchy(items, "ALL"));

        // filtre değişince yeniden render
        document.getElementById("tagFilter").addEventListener("change", (e) => {
          const tag = e.target.value;
          const filteredCount = (tag === "ALL") ? items.length : items.filter(x => (x.tag||"Diğer") === tag).length;
          setCountInfo(filteredCount);
          resetZoom();
          renderTreemap(toHierarchy(items, tag));
        });

        // toolbar eventler
        document.getElementById("zoomInBtn").addEventListener("click", zoomInTrue);
        document.getElementById("zoomOutBtn").addEventListener("click", zoomOutTrue);
        document.getElementById("resetZoomBtn").addEventListener("click", resetZoom);
        document.getElementById("shotBtn").addEventListener("click", takeShot);
        document.getElementById("fsBtn").addEventListener("click", toggleFullscreen);

        // fullscreen ikon değişimi (opsiyonel)
        document.addEventListener("fullscreenchange", () => {
          const icon = document.querySelector("#fsBtn i");
          if (!icon) return;
          icon.className = document.fullscreenElement ? "fa-solid fa-compress" : "fa-solid fa-expand";
        });

      } catch (err) {
        console.error(err);
        document.getElementById("chart").innerHTML =
          `<div style="padding:18px;color:#fff;">Hata: ${err.message}</div>`;
      }
    })();
  </script>
</body>
</html>
