<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Treemap | Bitunnel</title>
  <meta name="description" content="TR ve Global bahis/casino giriş adreslerini tek tıkla açabileceğiniz dinamik treemap platformu." />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css"/>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

  <style>
    :root{
      --bg:#0b1220; --text:#e5e7eb;
      --panel:rgba(255,255,255,.05); --panel2:rgba(255,255,255,.08);
      --stroke:rgba(255,255,255,.15);
    }
    body{background:var(--bg); color:var(--text);}
    .wrap{max-width:1280px; margin:22px auto; padding:0 14px;}
    .topbar{display:flex; gap:10px; align-items:center; justify-content:space-between; flex-wrap:wrap; margin-bottom:12px;}
    .leftbar{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
    .pill{
      background:var(--panel); border:1px solid var(--stroke); color:var(--text);
      border-radius:999px; padding:8px 12px; font-size:14px;
      display:inline-flex; gap:8px; align-items:center;
    }
    .hint{opacity:.85; font-size:13px;}
    #stage{
      width:100%; height:78vh;
      background:rgba(255,255,255,.03);
      border-radius:16px;
      border:1px solid rgba(255,255,255,.08);
      overflow:hidden;
      position:relative;
    }
    #chart{width:100%; height:100%;}
    .toolbar{
      position:absolute; top:12px; right:12px;
      display:flex; flex-direction:column; gap:8px;
      z-index:10;
    }
    .toolbtn{
      width:42px; height:42px; border-radius:14px;
      background:var(--panel2);
      border:1px solid rgba(255,255,255,.14);
      color:var(--text);
      display:flex; align-items:center; justify-content:center;
      cursor:pointer; user-select:none;
      transition:transform .12s ease, background .12s ease;
    }
    .toolbtn:hover{transform:translateY(-1px); background:rgba(255,255,255,.12);}
    .badge-mini{
      display:inline-block; padding:4px 10px; border-radius:999px;
      background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.10);
      font-size:12px; opacity:.95;
    }
    .select{
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.12);
      color:var(--text);
      border-radius:999px;
      padding:8px 12px;
      outline:none;
    }
    .select option{color:#111;}
    .footerbar{margin-top:10px; display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; opacity:.95;}
    .kbd{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New";}

    /* nodes */
    .node{cursor:pointer;}
    .node rect{stroke:rgba(255,255,255,.18);}
    .node:hover rect{stroke:rgba(255,255,255,.60);}
    .label{pointer-events:none; font-size:12px; fill:#fff;}
    .tag{pointer-events:none; font-size:11px; fill:rgba(255,255,255,.82);}
  </style>
</head>

<body oncontextmenu="return false;">
  <div class="wrap">
    <div class="topbar">
      <div class="leftbar">
        <span class="pill"><i class="fa-solid fa-chart-tree-map"></i> Treemap</span>
        <span class="pill">Kaynak: <span class="kbd">links.json</span></span>
        <span class="hint">Kutuya tıkla → JSON’daki URL yeni sekmede açılır • Glow = trend</span>
      </div>

      <div class="leftbar">
        <label class="pill" style="gap:10px;">
          <i class="fa-solid fa-filter"></i>
          <span>Filtre</span>
          <select id="tagFilter" class="select" aria-label="Tag filtrele">
            <option value="ALL">Tümü</option>
          </select>
        </label>
        <span id="countInfo" class="badge-mini">0 site</span>
        <span id="liveInfo" class="badge-mini">Canlı: kapalı</span>
      </div>
    </div>

    <div id="stage">
      <div class="toolbar" aria-label="Araçlar">
        <div class="toolbtn" id="zoomInBtn" title="Yakınlaştır (Zoom In)"><i class="fa-solid fa-plus"></i></div>
        <div class="toolbtn" id="zoomOutBtn" title="Uzaklaştır (Zoom Out)"><i class="fa-solid fa-minus"></i></div>
        <div class="toolbtn" id="resetZoomBtn" title="Sıfırla (Reset)"><i class="fa-solid fa-magnifying-glass-minus"></i></div>
        <div class="toolbtn" id="shotBtn" title="Ekran Görüntüsü (PNG indir)"><i class="fa-solid fa-camera"></i></div>
        <div class="toolbtn" id="fsBtn" title="Tam Ekran (Fullscreen)"><i class="fa-solid fa-expand"></i></div>
      </div>

      <div id="chart" aria-label="Treemap grafik alanı"></div>
    </div>

    <div class="footerbar">
      <div class="hint">
        İpucu: <span class="kbd">Enter</span>/<span class="kbd">Click</span> ile açılır • <span class="kbd">ESC</span> fullscreen çıkış
      </div>
      <div class="hint">© Treemap</div>
    </div>
  </div>

  <script>
    // =========================
    // AYARLAR
    // =========================
    const LINKS_URL = "./links.json";

    // ✅ Burayı kendi Worker URL’in ile değiştir:
    const API_BASE  = "https://bitunnel-treemap.info-bitunnel.workers.dev";


    // Kaç saniyede bir güncellensin? (Coin360 hissi)
    const REFRESH_MS = 8000; // 8 saniye (istersen 5000 yap)

    // Trend etki şiddeti (glow/border)
    const GLOW_MAX_PX = 14;

    // Tag renkleri (kutu rengi kategori sabit)
    const TAG_COLORS = new Map([
      ["BetConstruct", "#7c3aed"],
      ["Pronet Gaming", "#06b6d4"],
      ["Popüler", "#f59e0b"]
    ]);

    // =========================
    // UTIL
    // =========================
    function hash(s=""){ let h=0; for(let i=0;i<s.length;i++) h = Math.imul(31,h) + s.charCodeAt(i) | 0; return h; }
    function colorForTag(tag){ return TAG_COLORS.get(tag) || d3.schemeTableau10[Math.abs(hash(tag)) % 10]; }
    function clamp(x,a,b){ return Math.max(a, Math.min(b, x)); }

    function openUrl(url){
      if(!url) return;
      window.open(url, "_blank", "noopener,noreferrer");
    }

    // Boyut skoru: stabil + trend boost (Coin360 hissi)
    function computeSize(stat){
      if(!stat) return 1;
      const c24 = stat.clicks_24h || 0;
      const c1  = stat.clicks_1h  || 0;
      return Math.max(1, c24 + c1 * 3);
    }

    // Trend oranı (glow için): current hour vs previous hour
    function computeTrend(stat){
      if(!stat) return 0;
      const cur = stat.clicks_1h || 0;
      const prev = stat.prev_1h || 0;
      return (cur - prev) / Math.max(1, prev); // -1..+inf
    }

    async function trackClick(id){
      try{
        await fetch(`${API_BASE}/click`,{
          method:"POST",
          headers:{ "Content-Type":"application/json" },
          body: JSON.stringify({ id })
        });
      }catch{}
    }

    async function fetchStats(){
      try{
        const r = await fetch(`${API_BASE}/stats`, { cache:"no-store" });
        const j = await r.json();
        return (j && j.ok && j.stats) ? j.stats : {};
      }catch{
        return {};
      }
    }

    function setLiveInfo(on){
      document.getElementById("liveInfo").textContent = `Canlı: ${on ? "açık" : "kapalı"}`;
    }

    // =========================
    // LINKS.JSON -> HIERARCHY
    // =========================
    function toHierarchy(items, onlyTag="ALL", statsMap={}){
      const filtered = (onlyTag==="ALL") ? items : items.filter(x => (x.tag || "Diğer") === onlyTag);
      const groups = d3.group(filtered, d => d.tag || "Diğer");

      return {
        name: "Bahis ve Casino Siteleri",
        children: Array.from(groups, ([tag, arr]) => ({
          name: tag,
          children: arr.map(x => {
            const id = x.id; // id zorunlu dediğimiz için direkt alıyoruz
            const stat = statsMap[id];
            return {
              id,
              name: x.label,
              url: x.url,
              tag: x.tag || "Diğer",
              category: x.category || "",
              value: computeSize(stat),
              trend: computeTrend(stat),
              clicks_1h: stat?.clicks_1h || 0,
              clicks_24h: stat?.clicks_24h || 0
            };
          })
        }))
      };
    }

    // =========================
    // D3 TREEMAP (UPDATE + TRANSITION)
    // =========================
    let svg, gRoot, zoomBehavior;
    let lastWidth = 0, lastHeight = 0;

    function initSvg(){
      const el = document.getElementById("chart");
      const width  = el.clientWidth;
      const height = el.clientHeight;

      el.innerHTML = "";
      svg = d3.select(el).append("svg").attr("width", width).attr("height", height).style("touch-action","none");
      gRoot = svg.append("g");

      zoomBehavior = d3.zoom()
        .scaleExtent([0.6, 8])
        .on("zoom", (event)=> gRoot.attr("transform", event.transform));

      svg.call(zoomBehavior);

      lastWidth = width; lastHeight = height;
    }

    function layout(rootData){
      const el = document.getElementById("chart");
      const width  = el.clientWidth;
      const height = el.clientHeight;

      if(!svg || width !== lastWidth || height !== lastHeight){
        initSvg();
      }

      const root = d3.hierarchy(rootData)
        .sum(d => d.value || 0)
        .sort((a,b) => (b.value||0) - (a.value||0));

      d3.treemap()
        .size([lastWidth, lastHeight])
        .paddingInner(6)
        .paddingOuter(10)
        (root);

      return root.leaves();
    }

    function glowStyle(trend){
      // trend büyükse glow artar. 0..1 arası normalize edelim
      const t = clamp(trend, -1, 1);
      const strength = clamp(Math.abs(t), 0, 1);
      const isUp = t >= 0;
      const stroke = isUp
        ? `rgba(34,197,94,${0.15 + strength * 0.65})`
        : `rgba(239,68,68,${0.15 + strength * 0.65})`;

      const blurPx = Math.round(6 + strength * GLOW_MAX_PX);
      const glowCol = isUp ? "rgba(34,197,94,0.55)" : "rgba(239,68,68,0.55)";
      const filter = (strength < 0.12) ? "none" : `drop-shadow(0 0 ${blurPx}px ${glowCol})`;

      return { stroke, strokeWidth: 1 + strength * 3, filter };
    }

    function renderTreemap(rootData, animate=true){
      const leaves = layout(rootData);

      const sel = gRoot.selectAll("g.node")
        .data(leaves, d => d.data.id);

      // EXIT
      sel.exit()
        .transition().duration(animate ? 350 : 0)
        .style("opacity", 0)
        .remove();

      // ENTER
      const enter = sel.enter()
        .append("g")
        .attr("class","node")
        .attr("role","link")
        .attr("tabindex", 0)
        .style("opacity", 0)
        .on("click", (event, d) => {
          trackClick(d.data.id);     // say
          openUrl(d.data.url);       // aç
        })
        .on("keydown", (event, d) => {
          if(event.key === "Enter" || event.key === " "){
            event.preventDefault();
            trackClick(d.data.id);
            openUrl(d.data.url);
          }
        });

      enter.append("rect").attr("rx",12).attr("ry",12);
      enter.append("text").attr("class","label").attr("x",10).attr("y",18);
      enter.append("text").attr("class","tag").attr("x",10).attr("y",36);

      // UPDATE + ENTER MERGE
      const merged = enter.merge(sel);

      // Position transition
      merged.transition().duration(animate ? 500 : 0)
        .ease(d3.easeCubicOut)
        .style("opacity", 1)
        .attr("transform", d => `translate(${d.x0},${d.y0})`);

      // Rect update
      merged.select("rect").transition().duration(animate ? 500 : 0)
        .ease(d3.easeCubicOut)
        .attr("width", d => Math.max(0, d.x1 - d.x0))
        .attr("height", d => Math.max(0, d.y1 - d.y0))
        .attr("fill", d => colorForTag(d.data.tag || "Diğer"))
        .attr("opacity", 0.92)
        .attr("stroke", d => glowStyle(d.data.trend || 0).stroke)
        .attr("stroke-width", d => glowStyle(d.data.trend || 0).strokeWidth)
        .style("filter", d => glowStyle(d.data.trend || 0).filter);

      // Text update
      merged.select("text.label")
        .text(d => d.data.name);

      merged.select("text.tag")
        .text(d => d.data.tag || "");

      // Tooltip (native)
      merged.select("rect")
        .each(function(d){
          const t = d.data.trend || 0;
          const tPct = Math.round(t * 100);
          const title = `${d.data.name}\n${d.data.tag}\n1h: ${d.data.clicks_1h} | ~24h: ${d.data.clicks_24h}\nTrend: ${tPct}%`;
          d3.select(this).attr("title", title);
        });
    }

    // =========================
    // TOOLBAR
    // =========================
    function zoomInTrue(){ if(!svg) return; svg.transition().duration(180).call(zoomBehavior.scaleBy, 1.2); }
    function zoomOutTrue(){ if(!svg) return; svg.transition().duration(180).call(zoomBehavior.scaleBy, 1/1.2); }
    function resetZoom(){ if(!svg) return; svg.transition().duration(220).call(zoomBehavior.transform, d3.zoomIdentity); }

    async function takeShot(){
      const stage = document.getElementById("stage");
      const canvas = await html2canvas(stage, { backgroundColor:null, scale:2 });
      const a = document.createElement("a");
      a.href = canvas.toDataURL("image/png");
      a.download = `treemap-shot-${Math.floor(Math.random()*10000)}.png`;
      a.click();
    }

    async function toggleFullscreen(){
      const stage = document.getElementById("stage");
      if(!document.fullscreenElement) await stage.requestFullscreen?.();
      else await document.exitFullscreen?.();
    }

    // =========================
    // FILTER UI
    // =========================
    function populateFilterOptions(items){
      const select = document.getElementById("tagFilter");
      const tags = Array.from(new Set(items.map(x => x.tag || "Diğer"))).sort((a,b)=>a.localeCompare(b,"tr"));
      for(const t of tags){
        const opt = document.createElement("option");
        opt.value = t; opt.textContent = t;
        select.appendChild(opt);
      }
    }
    function setCountInfo(n){ document.getElementById("countInfo").textContent = `${n} site`; }

    // =========================
    // INIT + LIVE REFRESH
    // =========================
    let itemsCache = [];
    let liveTimer = null;

    async function refreshOnce(animate=true){
      const stats = await fetchStats();
      const tag = document.getElementById("tagFilter").value || "ALL";
      const hierarchy = toHierarchy(itemsCache, tag, stats);
      renderTreemap(hierarchy, animate);
    }

    function startLive(){
      if(liveTimer) return;
      setLiveInfo(true);
      liveTimer = setInterval(()=> refreshOnce(true), REFRESH_MS);
    }

    (async function init(){
      try{
        const res = await fetch(LINKS_URL, { cache:"no-store" });
        if(!res.ok) throw new Error("links.json okunamadı: " + res.status);
        const items = await res.json();

        // id kontrolü
        const missingId = items.find(x => !x.id);
        if(missingId) throw new Error("links.json içinde id eksik: " + JSON.stringify(missingId));

        itemsCache = items;

        populateFilterOptions(itemsCache);
        setCountInfo(itemsCache.length);

        // ilk render (stats ile)
        await refreshOnce(false);

        // filtre değişince
        document.getElementById("tagFilter").addEventListener("change", async (e)=>{
          const tag = e.target.value;
          const count = (tag==="ALL") ? itemsCache.length : itemsCache.filter(x => (x.tag||"Diğer")===tag).length;
          setCountInfo(count);
          resetZoom();
          await refreshOnce(false);
        });

        // toolbar eventler
        document.getElementById("zoomInBtn").addEventListener("click", zoomInTrue);
        document.getElementById("zoomOutBtn").addEventListener("click", zoomOutTrue);
        document.getElementById("resetZoomBtn").addEventListener("click", resetZoom);
        document.getElementById("shotBtn").addEventListener("click", takeShot);
        document.getElementById("fsBtn").addEventListener("click", toggleFullscreen);

        document.addEventListener("fullscreenchange", ()=>{
          const icon = document.querySelector("#fsBtn i");
          if(icon) icon.className = document.fullscreenElement ? "fa-solid fa-compress" : "fa-solid fa-expand";
        });

        // live başlat
        startLive();

        // responsive: resize olunca tekrar kur
        window.addEventListener("resize", ()=>{
          initSvg();
          refreshOnce(false);
        });

      }catch(err){
        console.error(err);
        document.getElementById("chart").innerHTML =
          `<div style="padding:18px;color:#fff;">Hata: ${err.message}</div>`;
        setLiveInfo(false);
      }
    })();
  </script>
</body>
</html>
